[project]
name = "bcb-pipeline"
version = "0.1.0"
description = "ETL pipeline for Banco Central (SGS) series into PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pandera",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
]

[project.optional-dependencies]
dev  = ["pytest", "ruff"]
dash = ["streamlit", "plotly"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
